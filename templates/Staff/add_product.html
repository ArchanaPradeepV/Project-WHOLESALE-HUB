{% extends 'Staff/index.html' %}
{% load static %}

{% block body %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Staff</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }
        .form-title {
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 600;
            color: #343a40;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            font-weight: 500;
        }
        .btn-custom {
            border-radius: 0.25rem;
            transition: all 0.3s;
        }
        .btn-custom:hover {
            background-color: #0056b3;
            color: #ffffff;
        }
        .btn-secondary-custom {
            border-radius: 0.25rem;
            transition: all 0.3s;
        }
        .btn-secondary-custom:hover {
            background-color: #6c757d;
            color: #ffffff;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="form-container">
                <h2 class="form-title">Add New Product</h2>
                <form id="form1" name="form1" method="post" action="add_product_post" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="form-group">
                        <label for="name"> Name </label>
                        <input type="text" id="name" name="name"  class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="place">Description</label>
                        <input type="text" id="place" name="description"title="Enter description only characters allowed" class="form-control" pattern="[a-z A-Z.]+" required>
                    </div>

{#                    <div class="form-group">#}
{#                        <label for="phone">Price</label>#}
{#                        <input type="number" id="price" name="price" value="{{ val.Price }}" class="form-control" step="0.01" required>#}
{#                    </div>#}

                <div class="form-group">
    <label for="price">Price</label>
    <input type="number" id="price" name="price" value="{{ val.Price }}" class="form-control" min="0.01" step="0.01" title="Please enter a valid price greater than zero with two decimal places (e.g., 10.00)." required>
</div>
                <div class="form-group">
    <label for="stock">Stock (in meters)</label>
    <input type="number" id="stock" name="stock" value="{{ val.Stock }}" class="form-control" min="1" step="1" title="Please enter a valid stock greater than zero." required>
</div>


                    <div class="form-group">
                        <label for="image">Image</label>
                        <input type="file" id="image" name="image" class="form-control-file" accept="image/png,image/jpeg">
                    </div>
                    <div class="form-group">
                <label for="colour">Colour</label>
                <input type="text" id="colour" name="colour" value="{{ val.Colour }}" class="form-control" pattern="[a-zA-Z\s]+" required title="Enter description (only letters allowed)">
            </div>
                    <div class="form-group">
                        <label for="username">Category id</label>
                        <select name="cat">
                            {% for i in val %}
                                <option value="{{ i.id }}">{{ i.Category }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-primary btn-custom">Submit</button>
                        <a href="staff_manage_products" class="btn btn-secondary btn-secondary-custom ms-2">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
{% endblock %}
