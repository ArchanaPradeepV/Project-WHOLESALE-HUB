{% extends 'Admin/index.html' %}
{% block body %}
<style>
    .table-wrapper {
        margin-top: 20px;
    }
    .table-img {
        height: 100px;
        width: 100px;
        object-fit: cover;
    }
    .btn-edit {
        transition: background-color 0.3s, color 0.3s;
    }
    .btn-edit:hover {
        background-color: #0056b3;
        color: #fff;
    }
    .btn-add {
        margin-bottom: 20px;
    }
    .content-wrapper {
        margin-top: 120px; /* Increased margin for more gap */
    }
</style>

<div class="container content-wrapper">
    <form action="staff_view_product_search" method="post">

        <div class="table-wrapper">
            <div class="row">
                {% for i in page_obj %}
                <div class="col-sm-4">
                    <div class="card">
                        <img src="{{ i.Image.url }}" alt="Sample Image" class="card-image" height="250">
                        <div class="card-content">
                            <h2 class="card-title">{{ i.Name|capfirst }}</h2>
                            <p class="card-description">{{ i.Description }}</p>
                            <p class="card-description">{{ i.Stock }}</p>
                            <p class="card-description">{{ i.Price|floatformat:2 }}</p>
                            <p class="card-description">{{ i.Colour }}</p>
                            <p class="card-description">{{ i.Categoryid.Category }}</p>


                        </div>
                    </div>
                </div>
                <br/>
                <br/>
                {% endfor %}
            </div>
        </div>
    </form>
</div>

{% endblock body %}
