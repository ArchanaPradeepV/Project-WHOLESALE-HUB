{% extends 'Retailer/base.html' %}
{% block body %}
<style>
    .table-wrapper {
        margin-top: 20px;
    }
    .table-img {
        height: 100px;
        width: 100px;
        object-fit: cover;
    }
    .btn-edit {
        transition: background-color 0.3s, color 0.3s;
    }
    .btn-edit:hover {
        background-color: #0056b3;
        color: #fff;
    }
    .btn-add {
        margin-bottom: 20px;
    }
    .content-wrapper {
        margin-top: 100px;
        background-color: #f9f9f9; /* Light background color */
        padding: 30px;
        border-radius: 10px;
    }
    form {
        display: flex;
        gap: 15px;
        align-items: center;
        background-color: #fff; /* White background for form */
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        margin-bottom: 30px;
    }
    label {
        margin-bottom: 0;
        font-weight: bold;
    }
    .form-control {
        padding: 10px;
        border-radius: 5px;
        border: 1px solid #ddd;
        width: 200px;
    }
    .btn-primary {
        background-color: #007bff;
        border-color: #007bff;
        padding: 10px 20px;
        font-size: 16px;
        transition: background-color 0.3s ease;
    }
    .btn-primary:hover {
        background-color: #0056b3;
    }
    .card {
        background-color: #fff; /* White background for product cards */
        box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 30px;
        transition: transform 0.3s ease;
    }
    .card:hover {
        transform: translateY(-10px);
    }
    .card-image {
        width: 100%;
        height: 200px;
        object-fit: cover;
        background-color: #f0f0f0; /* Placeholder background if image fails to load */
    }
    .card-content {
        padding: 15px;
        background-color: #fff; /* Ensure content background is white */
    }
    .card-title {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 10px;
        color: #333;
    }
    .card-description {
        font-size: 14px;
        color: #666;
        margin-bottom: 10px;
    }
    .btn {
        margin: 10px 5px;
        padding: 10px 20px;
        font-size: 14px;
        border-radius: 5px;
        transition: background-color 0.3s ease;
    }
    .btn-info {
        background-color: #17a2b8;
        border-color: #17a2b8;
    }
    .btn-info:hover {
        background-color: #138496;
    }
    .btn-primary {
        background-color: #007bff;
        border-color: #007bff;
    }
    .btn-primary:hover {
        background-color: #0056b3;
    }
</style>

<div class="container content-wrapper">
    <form action="/user_view_product_search" method="post">
        <label for="name-search">Name:</label>
        <input type="text" id="name-search" name="textfield" placeholder="Enter name to search" class="form-control"/>
        <label for="color-search">Colour:</label>
        <input type="text" id="color-search" name="clr" placeholder="Enter colour to search" class="form-control"/>
        <input type="submit" name="Submit" value="Search" class="btn btn-primary"/>
    </form>

    <div class="table-wrapper">
        <div class="row">
            {% for i in page_obj %}
            <div class="col-sm-4">
                <div class="card">
                    <img src="{{ i.Image.url }}" alt="Sample Image" class="card-image">
                    <div class="card-content">
                        <h2 class="card-title">{{ i.Name|capfirst }}</h2>
                        <p class="card-description">{{ i.Description }}</p>
                        <p class="card-description">Stock: {{ i.Stock }}</p>
                        <p class="card-description">Price: ₹{{ i.Price|floatformat:2 }}</p>
                        <p class="card-description">Colour: {{ i.Colour }}</p>
                        <p class="card-description">Category: {{ i.Categoryid.Category }}</p>
                        <div align="center">
                            <a href="/add_to_cart/{{ i.id }}#page" class="btn btn-primary">View More</a>
{#                            <a href="#" class="btn btn-info">Buy Now</a>#}
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

{% endblock body %}
