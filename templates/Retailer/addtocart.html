{% extends 'Retailer/base.html' %}
{% load static %}

{% block body %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Staff</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .table-wrapper {
            margin-top: 20px;
        }
        .table-img {
            height: 100px;
            width: 100px;
            object-fit: cover;
        }
        .btn-edit {
            transition: background-color 0.3s, color 0.3s;
        }
        .btn-edit:hover {
            background-color: #0056b3;
            color: #fff;
        }
        .btn-add {
            margin-bottom: 20px;
        }
        .content-wrapper {
            margin-top: 100px; /* Adjust the margin-top for more gap */
        }
    </style>
</head>

<!-- Added a content-wrapper to add gap -->
<div class="container content-wrapper">

    <form action="/add_to_cart_post" method="post">

        <div class="table-wrapper">
            <div class="row" id="page">
                <div class="col-sm-4"></div>
                {% for i in page_obj %}
                <div class="col-sm-4">
                    <div class="card">
                        <img src="{{ i.Image.url }}" alt="Sample Image" class="card-image">
                        <div class="card-content">
                            <h2 class="card-title">{{ i.Name|capfirst }}</h2>
                            <p class="card-description">{{ i.Description }}</p>
                            <p class="card-description">₹ {{ i.Price }}0</p>
                            <p class="card-description">{{ i.Stock }} available</p>
                            <p class="card-description">{{ i.Colour }}</p>
                            <p class="card-description">{{ i.Categoryid.Category }}</p>
                            <p class="card-description">
                                <input type="number" name="qty" required placeholder="Quantity" class="form-control" required min="1" max="{{ i.Stock }}"/>
                            </p>
                            <div align="center">
                                <input type="submit" name="submit" value="Add To Cart" class="btn btn-primary" />
                                <input type="submit" name="submit" value="Buy Now" class="btn btn-primary" />
                            </div>
                        </div>
                    </div>
                </div>
                <br/>
                {% endfor %}
            </div>
        </div>

    </form>

</div> <!-- End of container -->

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
{% endblock %}
